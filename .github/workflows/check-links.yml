name: Check Links
on:
  workflow_dispatch: # Manual checks
  schedule:
    - cron: 31 13 * * 2 # 13:31 on Tuesdays

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        env:
          FORCE_COLOR: 0
        with:
          node-version: 24 # TODO: return to lts/* once 1) we're back to passing runs and 2) 24 is added to package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node packages/gscan/test/valid-doc-links.js
