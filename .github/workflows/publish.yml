name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview what would be published without actually publishing'
        required: false
        type: boolean
        default: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    if: github.repository == 'TryGhost/gscan'
    concurrency:
      group: publish-npm-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    env:
      FORCE_COLOR: 1
      CI: true
      NPM_CONFIG_PROVENANCE: true
      # actions/setup-node's registry-url input always writes an .npmrc
      # referencing ${NODE_AUTH_TOKEN} for the registry auth line, regardless
      # of auth method. We publish via npm OIDC Trusted Publishing (see
      # `permissions: id-token: write` above), so no token secret is ever
      # set. Both npm and pnpm tolerate the unresolved reference, but pnpm
      # logs a `Failed to replace env in config` warning on every command.
      # An empty value here keeps that noise out of the logs without
      # providing (or needing) a real token.
      NODE_AUTH_TOKEN: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # npm 11+ is required for npm Trusted Publishing (OIDC).
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --prefer-offline --ignore-scripts --frozen-lockfile

      - name: Compare local and npm versions
        id: version_check
        shell: bash
        run: |
          local_version=$(node -p "require('./package.json').version")
          npm_version=$(npm view gscan version 2>/dev/null || true)

          echo "local_version=$local_version" >> "$GITHUB_OUTPUT"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"

          if [[ -z "$npm_version" || "$local_version" != "$npm_version" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=version-diff" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=same-version" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs['dry-run'] == 'true'
        run: pnpm run ship:ci
        env:
          NPM_CONFIG_DRY_RUN: true

      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs['dry-run'] != 'true')
        run: pnpm run ship:ci

      - name: Skip publish summary
        if: steps.version_check.outputs.should_publish != 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs['dry-run'] == 'true')
        run: |
          echo "Publish not executed."
          echo "Version check: ${{ steps.version_check.outputs.reason || 'not-run' }}"
          echo "Dry run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['dry-run'] == 'true' }}"

      - uses: tryghost/actions/actions/slack-build@0cbdcbeb9030f46b109d5e6e44c14933026d8ca5
        if: failure()
        with:
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
